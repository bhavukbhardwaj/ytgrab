<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytgrab</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1a1a1a; --mute:#6b6b6b; --line:#e3e3df; --accent:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --ink:#f0f0f0; --mute:#9a9a9a; --line:#333; --accent:#ff5a4d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 24px; font-size:28px; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; min-width:0; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .meta { display:flex; gap:14px; padding:16px; }
  .meta img { width:160px; border-radius:8px; align-self:flex-start; }
  .meta h2 { margin:0 0 4px; font-size:17px; }
  .meta p { margin:0; color:var(--mute); font-size:14px; }
  h3 { margin:0; padding:10px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); border-top:1px solid var(--line); }
  .opts { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 16px; }
  .opts button { background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500; padding:9px 14px; }
  .opts button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  #msg { margin-top:16px; color:var(--mute); font-size:14px; }
  #msg.err { color:var(--accent); }
  .note { margin-top:32px; font-size:12px; color:var(--mute); }
  @media (max-width:480px) { .meta { flex-direction:column; } .meta img { width:100%; } }
</style>
</head>
<body>
<main>
  <h1>ytgrab</h1>
  <form class="row" id="f">
    <input id="url" type="url" placeholder="Paste a YouTube link" required autofocus>
    <button id="go">Fetch</button>
  </form>
  <div id="msg"></div>
  <div class="card" id="card" hidden>
    <div class="meta"><img id="thumb" alt=""><div><h2 id="title"></h2><p id="sub"></p></div></div>
    <h3>Video</h3><div class="opts" id="video"></div>
    <h3>Audio only</h3><div class="opts" id="audio"></div>
  </div>
  <p class="note">Runs only on your computer. Download only content you own or have permission to save.</p>
</main>
<script>
const $ = id => document.getElementById(id);
let current = "";
const say = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const fmt = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "";

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  current = $("url").value.trim();
  $("go").disabled = true; $("card").hidden = true; say("Fetching…");
  try {
    const r = await fetch("/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url:current})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("thumb").src = d.thumbnail || ""; $("title").textContent = d.title;
    $("sub").textContent = [d.channel, fmt(d.duration)].filter(Boolean).join(" · ");
    for (const k of ["video","audio"]) {
      $(k).replaceChildren(...d[k].map(o => {
        const b = document.createElement("button"); b.textContent = o.label;
        b.onclick = () => grab(o, b); return b;
      }));
    }
    $("card").hidden = false; say("");
  } catch (err) { say(err.message, true); }
  $("go").disabled = false;
});

async function grab(o, btn) {
  const all = document.querySelectorAll(".opts button"); all.forEach(b => b.disabled = true);
  say(`Preparing ${o.label}… (large files can take a while)`);
  try {
    const r = await fetch(`/api/download?format=${o.id}&url=${encodeURIComponent(current)}`);
    if (!r.ok) throw new Error((await r.json()).error);
    const name = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(r.headers.get("Content-Disposition")||"")?.[1];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = name ? decodeURIComponent(name) : "download";
    a.click(); say("Done. Check your Downloads folder.");
  } catch (err) { say(err.message, true); }
  all.forEach(b => b.disabled = false);
}
</script>
</body>
</html>
