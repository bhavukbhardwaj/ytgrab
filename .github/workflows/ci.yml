name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Version files agree
        run: |
          v=$(cat VERSION)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "Dockerfile version does not match VERSION ($v)"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ytgrab:ci .
      - name: Run and check health and UI
        run: |
          docker run -d --name ytgrab-ci -p 5055:5055 ytgrab:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:5055/healthz && break; sleep 1; done
          curl -fsS http://localhost:5055/healthz | grep -q ok
          curl -fsS http://localhost:5055/ | grep -q ytgrab
          docker exec ytgrab-ci ffmpeg -version | head -1
          docker exec ytgrab-ci yt-dlp --version
      - name: Container logs
        if: failure()
        run: docker logs ytgrab-ci
